<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07131d">
  <title>Buzzer!</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main id="lobby" class="screen lobby">
    <div class="brand"><span>BUZZER</span><i>!</i></div>
    <p class="tagline">An instant true-or-false quiz for everyone in the room.</p>
    <form id="lobby-form" class="panel">
      <label for="display-name">Your name</label>
      <input id="display-name" maxlength="20" autocomplete="nickname" placeholder="Quizzer" required>
      <div id="main-actions" class="stack">
        <button id="create-game" type="button" class="primary">Create new game</button>
        <button id="show-join" type="button" class="secondary">Join existing game</button>
      </div>
      <div id="join-actions" class="stack" hidden>
        <label for="room-code">Game code</label>
        <input id="room-code" maxlength="5" inputmode="text" autocomplete="off" placeholder="ABCDE" required>
        <button type="submit" class="primary">Join game</button>
        <button id="back" type="button" class="quiet">Back</button>
      </div>
      <p id="lobby-error" class="error" role="alert"></p>
    </form>
    <button id="install-app" class="install" hidden>Install Buzzer</button>
    <p id="ios-install" class="install-help" hidden>To install on iPhone or iPad, use the browser’s Share icon (not “Share invite”), then choose “Add to Home Screen”.</p>
  </main>

  <main id="game" class="screen game" hidden>
    <header>
      <div><span class="eyebrow">Game</span><strong id="room-label">-----</strong></div>
      <div class="header-actions"><button id="copy-invite" class="icon-button">Share invite</button><button id="leave-game" class="icon-button">Leave</button></div>
    </header>
    <section class="round-heading">
      <span id="connection-status" class="connection">Connecting…</span>
      <h1 id="question-title">Game lobby</h1>
      <p id="player-status">Waiting for a host…</p>
    </section>
    <section id="feedback" class="feedback" hidden></section>
    <section id="answer-pad" class="answer-pad">
      <button id="true-button" class="answer true" aria-label="True">✓</button>
      <button id="false-button" class="answer false" aria-label="False">✗</button>
    </section>
    <section id="players-panel" class="players-panel">
      <div class="section-title"><h2>Players</h2><span id="player-count">0</span></div>
      <div id="player-list" class="player-list"></div>
    </section>
    <footer id="host-controls" class="controls">
      <button id="claim-host" class="amber">Become host</button>
      <button id="start-game" class="primary" hidden>Start quiz</button>
      <button id="next-question" class="primary" hidden>Score &amp; next</button>
      <button id="end-game" class="danger" hidden>End quiz</button>
      <button id="reset-game" class="secondary" hidden>New quiz</button>
    </footer>
  </main>
</body>
</html>
