<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07101c">
  <title>MazeTag — Photon Labyrinth</title>
  <link rel="stylesheet" href="styles.css">
  <style>[hidden]{display:none!important}.back-lobby{pointer-events:auto;text-decoration:none;color:#afc2d3;border:1px solid #8cecff2b;border-radius:999px;background:#08111ddd;padding:8px 12px;font-size:11px;font-weight:800;letter-spacing:.08em}.back-lobby:hover{color:#32dbf4;border-color:#32dbf466}dialog{position:fixed;inset:50% auto auto 50%;transform:translate(-50%,-50%);max-height:calc(100vh - 20px);overflow:auto;margin:0}.credits-link{text-align:center;margin:4px 0}.credits-link a{color:#8298ad;font-size:11px;text-decoration:none}.credits-link a:hover{color:#32dbf4}@media(max-width:650px){.back-lobby{font-size:0;padding:8px 10px}.back-lobby::after{content:"← Lobby";font-size:10px}}@media(max-height:620px){dialog form{padding:20px}dialog h1{font-size:44px;margin:10px 0}dialog .lede{margin:0 0 12px;font-size:14px}dialog .hint{margin:8px 0}}</style>
  <script src="config.js?v=photon-2"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js"}}</script>
</head>
<body>
  <canvas id="maze"></canvas>
  <header class="topbar">
    <a class="brand" href="./" aria-label="MazeTag lobby"><span>MAZE</span><b>TAG</b></a>
    <a class="back-lobby" href="./">← Back to lobby</a>
    <div class="room-pill" id="room-label" hidden>ROOM —</div>
    <div class="connection" id="connection">Offline</div>
  </header>

  <section class="hud" id="hud" hidden>
    <div class="status-card"><small>STATUS</small><strong id="status">Waiting</strong><span id="clock">04:00</span></div>
    <ol id="scores"></ol>
  </section>
  <div class="spectator" id="spectator" hidden>SPECTATING · MAZE OVERVIEW</div>
  <nav class="controls" id="controls" hidden aria-label="Turn controls">
    <button data-turn="left" aria-label="Queue left turn">↰<small>LEFT</small></button>
    <button data-turn="right" aria-label="Queue right turn">↱<small>RIGHT</small></button>
  </nav>
  <button class="invite" id="invite" hidden>Invite</button>
  <div class="toast" id="toast"></div>

  <dialog id="join-dialog" open>
    <form id="join-form" method="dialog">
      <div class="eyebrow">SARCASTIC HEDGEHOG · PHOTON EDITION</div>
      <h1><span>MAZE</span>TAG</h1>
      <p class="lede">Run the maze. Collect energy. Leave a trail. Don’t be <em>It</em>.</p>
      <label>Display name<input id="runner-name" maxlength="18" autocomplete="nickname" value="Runner"></label>
      <div class="split">
        <label>Maze<select id="map-select"><option>Loading maps…</option></select></label>
        <label>Room code<input id="room-code" maxlength="12" value="LABYRINTH" spellcheck="false"></label>
      </div>
      <button class="primary" type="submit">ENTER THE MAZE</button>
      <button class="secondary" type="button" id="practice">PRACTICE WITH A GHOST</button>
      <p class="hint"><kbd>←</kbd> / <kbd>→</kbd> or <kbd>A</kbd> / <kbd>D</kbd>. Tap before a junction: your turn is remembered.</p>
      <p class="credits-link"><a href="credits.html">Credits &amp; technology</a></p>
      <p class="error" id="join-error"></p>
    </form>
  </dialog>
  <script type="module" src="src/main.js"></script>
</body>
</html>
