<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#84d8e8">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Hello Copter — Flight Test</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="menu.css?v=2">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Hello Copter game"></canvas>

    <section id="lobby" class="menu-screen">
      <div class="menu-stage">
        <img class="menu-logo" src="assets/images/menu/logo.png" alt="Hello Copter">
        <div class="menu-bird bird-left" aria-hidden="true"></div>
        <div class="menu-bird bird-right" aria-hidden="true"></div>

        <button id="open-flight" class="picture-button menu-start" aria-label="Start"><img src="assets/images/menu/start.png" alt=""></button>
        <button id="how" class="picture-button menu-help" aria-label="Help"><img src="assets/images/menu/help.png" alt=""></button>
        <button id="show-credits" class="picture-button menu-credits" aria-label="Credits"><img src="assets/images/menu/credits.png" alt=""></button>

        <div class="menu-utility" aria-label="Audio controls">
          <button id="sound-toggle" class="picture-button mini-button" aria-label="Toggle sound effects" aria-pressed="true"><img src="assets/images/menu/sound-on.png" alt=""></button>
          <button id="music-toggle" class="picture-button mini-button" aria-label="Toggle music" aria-pressed="true"><img src="assets/images/menu/music-on.png" alt=""></button>
        </div>
        <div class="best-score"><small>BEST FLIGHT</small><strong id="menu-best">000000</strong></div>

        <div class="menu-copter" aria-hidden="true"></div>
        <img class="menu-heliport" src="assets/images/menu/heliport.png" alt="" aria-hidden="true">
        <img class="menu-copyright" src="assets/images/menu/copyright.png" alt="©2012 Sarcastic Hedgehog Ltd">
      </div>

      <div id="flight-setup" class="menu-modal hidden">
        <div class="setup-card">
          <button id="close-setup" class="round-back" aria-label="Back to main menu">×</button>
          <h2>Ready to fly?</h2>
          <p>Choose a callsign and your stretch of sky.</p>
          <label>CALLSIGN<input id="name" maxlength="16" value="Marmite One" autocomplete="nickname"></label>
          <div class="flight-modes" role="group" aria-label="Flight mode">
            <button type="button" data-mode="solo" class="selected"><b>SOLO FLIGHT</b><small>The restored arcade run</small></button>
            <button type="button" data-mode="shared"><b>SHARED SKIES</b><small>Meet other pilots in the loop</small></button>
          </div>
          <label id="room-field" class="hidden">AIRSPACE CODE<input id="room" maxlength="12" value="FLOCK" autocapitalize="characters"></label>
          <p id="lobby-error" class="lobby-error hidden"></p>
          <button id="launch" class="launch-bubble">FLY!</button>
        </div>
      </div>
    </section>

    <section id="help" class="menu-screen menu-overlay hidden">
      <div class="art-panel">
        <img src="assets/images/menu/help-panel.png" alt="Fly by holding space, mouse or touch. Rescue birds and dodge obstacles.">
        <button id="close-help" class="art-back" aria-label="Back to main menu">BACK</button>
      </div>
    </section>

    <section id="credits" class="menu-screen menu-overlay hidden">
      <div class="art-panel">
        <img src="assets/images/menu/credits-panel.png" alt="Original Hello Copter credits">
        <button id="close-credits" class="art-back" aria-label="Back to main menu">BACK</button>
      </div>
    </section>

    <header id="hud" class="hidden">
      <div class="brand">HELLO <span>COPTER</span></div>
      <div class="readouts">
        <div><small>DISTANCE</small><strong id="distance">0000</strong></div>
        <div><small>RESCUED</small><strong id="rescued">0</strong></div>
        <div><small>MULTIPLIER</small><strong id="multiplier">1×</strong></div>
        <div><small>SCORE</small><strong id="score">000000</strong></div>
      </div>
      <button id="pause" aria-label="Pause">Ⅱ</button>
    </header>

    <aside id="status" class="hidden">
      <div id="lives" class="lives"></div>
      <div id="shield-meter" class="shield-meter"><span></span><b>SHIELD</b></div>
      <div id="direction" class="direction">FLYING EAST</div>
      <div id="network-status" class="network-status hidden">SHARED SKIES · 1 PILOT</div>
    </aside>

    <div id="message" class="message hidden"></div>

    <section id="pause-panel" class="panel-wrap hidden">
      <div class="panel compact">
        <div class="eyebrow">FLIGHT SUSPENDED</div><h2>Paused</h2>
        <button id="resume" class="primary">RESUME</button>
        <button id="quit" class="ghost">RETURN TO LOBBY</button>
      </div>
    </section>

    <section id="results" class="panel-wrap hidden">
      <div class="panel result-card">
        <div class="eyebrow">FLIGHT REPORT</div><h2 id="result-title">A noble attempt.</h2>
        <div class="result-grid">
          <div><small>DISTANCE</small><strong id="result-distance">0</strong></div>
          <div><small>SCORE</small><strong id="result-score">0</strong></div>
          <div><small>RESCUED</small><strong id="result-rescued">0</strong></div>
        </div>
        <button id="again" class="primary">FLY AGAIN</button>
        <button id="result-lobby" class="ghost">LOBBY</button>
      </div>
    </section>

    <div id="touch-controls" class="touch-controls hidden">
      <button data-control="left" aria-label="Fly left">←</button>
      <button data-control="right" aria-label="Fly right">→</button>
      <button data-control="lift" class="lift" aria-label="Lift">LIFT</button>
    </div>
  </main>
  <script>
    if (location.protocol === 'file:') addEventListener('DOMContentLoaded', () => {
      const warning = document.querySelector('#lobby-error');
      warning.textContent = 'Hello Copter cannot run directly from a file:/// address. Open this folder with VS Code Live Server, then use the http:// address it provides.';
      warning.classList.remove('hidden');
      document.querySelectorAll('button').forEach(button => button.disabled = true);
    });
  </script>
  <script src="config.js"></script>
  <script type="module" src="src/game.js?v=menu1"></script>
</body>
</html>
